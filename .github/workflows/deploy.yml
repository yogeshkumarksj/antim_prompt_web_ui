name: Deploy to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          # Prefer a repo Variable, then a Secret; otherwise use the production API default.
          VITE_API_URL: ${{ vars.VITE_API_URL || secrets.VITE_API_URL || 'https://prompt-karo-backend.onrender.com' }}
        run: npm run build

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          # If the Hostinger FTP account's home directory is already public_html, change this to ./
          server-dir: ./public_html/
          # Never wipe the remote directory. Server-only files (upload_handler.php,
          # weather_media_sync.php, uploads/, etc.) stay unless they were previously
          # tracked in .ftp-deploy-sync-state.json from this action.
          dangerous-clean-slate: false
